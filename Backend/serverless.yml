  updateSurveyResponse:
    handler: handlers/surveys/handler.updateResponseStatus
    events:
      - httpApi:
          path: /surveys/{id}/responses/{workerId}
          method: POST
          authorizer:
            name: sesionUsuario

  incidentsModule:
    handler: handlers/incidents-module/handler.incidentsHandler
    events:
      - httpApi:
          path: /incidents
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /incidents/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # `POST /test-email` retirado: endpoint de prueba expuesto en producción que
  # permitía disparar correos desde el remitente verificado del sistema y
  # registraba RUT y contraseña temporal en CloudWatch. La función interna
  # `sendWelcomeEmail` la sigue usando el alta de empresa y no se toca.

  inboxModule:
    handler: handlers/inbox-module/handler.inboxHandler
    events:
      - httpApi:
          path: /inbox
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /inbox/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # Suggestions (Sugerencias)
  createSuggestion:
    handler: handlers/suggestions/handler.create
    events:
      - httpApi:
          path: /suggestions
          method: POST
          authorizer:
            name: sesionUsuario

resources:
  Resources:
    # ==========================================
    # S3 BUCKETS
    # ==========================================
    # Estuvieron FUERA del stack: creados a mano durante la migración a
    # BuildAndServe, con la idea de que un `serverless remove` no pudiera
    # borrarlos. El efecto real era el contrario del buscado: nadie los
    # gobernaba. Ningún despliegue podía comprobar —ni corregir— si tenían
    # versionado, qué orígenes aceptaban por CORS o cómo estaban cifrados, y la
    # respuesta resultó ser: sin versionado (un borrado era definitivo) y CORS
    # abierto a cualquier origen.
    #
    # Ahora se declaran acá y se incorporaron al stack por IMPORT de
    # CloudFormation, que los adopta SIN recrearlos ni tocar su contenido. La
    # protección contra el borrado del stack no se pierde: la da
    # `DeletionPolicy: Retain`, que es el mecanismo que corresponde, en vez de
    # dejarlos huérfanos.
    RepositoryBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.repositoryBucketName}
        # El borrado deja de ser definitivo: la versión anterior queda y se puede
        # restaurar. Es la contraparte en S3 del PITR de las tablas, y el
        # prerrequisito del bloqueo de objetos que exige la política de retención.
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
              BucketKeyEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            # Acotado a los orígenes de la aplicación: estaba en '*', o sea
            # cualquier página de internet podía hacerle peticiones al bucket
            # desde el navegador de quien la visitara.
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, HEAD]
              AllowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}, self:custom.corsOrigins.prod}
              ExposedHeaders: [ETag]
              MaxAge: 3000

    EvidenceBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.evidenceBucketName}
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
              BucketKeyEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, HEAD]
              AllowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}, self:custom.corsOrigins.prod}
              ExposedHeaders: [ETag]
              MaxAge: 3000

    # ==========================================
    # SNS
    # ==========================================
    IncidentNotificationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:provider.environment.INCIDENT_NOTIFICATION_TOPIC}
        DisplayName: Notificaciones de Incidentes y Accidentes

    # ==========================================
    # SQS - Estampado de PDF firmado (serializado por documento)
    # ==========================================
    # Cola FIFO: el estampado se dispara "bajo demanda" (al pedir la descarga
    # del PDF firmado) pero varios triggers casi simultáneos sobre el MISMO
    # documento (varias descargas pedidas a la vez, o varias firmas llegando
    # justo cuando el documento se completa) deben serializarse para no
    # regenerar el PDF en paralelo y pisarse entre sí. MessageGroupId =
    # documentId garantiza que SQS FIFO procese de a un job por documento.
    DocumentStampDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-stamp-dlq-${self:provider.stage}.fifo
        FifoQueue: true
        MessageRetentionPeriod: 1209600 # 14 días

    DocumentStampQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-stamp-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DocumentStampDLQ.Arn
          maxReceiveCount: 3

    # ==========================================
    # MULTI-TENANT CORE TABLES
    # ==========================================

    # Tenants - Empresas clientes del SaaS
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.TENANTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: slug
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: slug-index
            KeySchema:
              - AttributeName: slug
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: status-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Obras - Proyectos de construccion por tenant
    ObrasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.OBRAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: obraId
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: obraId-index
            KeySchema:
              - AttributeName: obraId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Personas - Identidad unificada (reemplaza Users + Workers)
    PersonasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.PERSONAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: rut
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: tenantRut-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: rut
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # ==========================================
    # OPERATIONAL TABLES (updated with tenant GSIs)
    # ==========================================

    # Documents Table - with tenant and obra GSIs
    DocumentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.DOCUMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: documentId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: documentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          # NOTE: obraId-index will be added in a follow-up deploy
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Suggestions Table
    SuggestionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SUGGESTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: suggestionId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: suggestionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-createdAt-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # (DynamoDB only allows 1 new GSI per CloudFormation update)
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Activities Table - with tenant GSI
    ActivitiesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.ACTIVITIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: activityId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: activityId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Ausencias / permisos del día. PK = tenantId, SK = "{obraId}#{fecha}#{personaId}"
    # (una ausencia por persona/día/obra; registrar de nuevo la sobrescribe).
    AusenciasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.AUSENCIAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Catálogo de EPP del tenant (DS44 Art. 13). PK = tenantId, SK = eppId:
    # cada empresa administra sus propios elementos y una Query por PK basta
    # para listar el catálogo completo.
    EppTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.EPP_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: eppId
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: eppId
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Estructura preventiva (DS 44 Arts. 23, 50, 65, 66): órganos, integrantes y
    # reuniones en una sola tabla, distinguidos por prefijo en la sort key:
    #   ORG#{organoId}  ·  MIE#{organoId}#{miembroId}  ·  REU#{organoId}#{reunionId}
    # Así listar órganos no arrastra las ~24 reuniones de cada mandato.
    EstructuraPreventivaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.ESTRUCTURA_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Incidents Table - rename empresaId to tenantId
    IncidentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.INCIDENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: incidentId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: fecha
            AttributeType: S
        KeySchema:
          - AttributeName: incidentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-fecha-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: fecha
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Signatures Table - with tenant and persona GSIs
    SignaturesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SIGNATURES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: signatureId
            AttributeType: S
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
        KeySchema:
          - AttributeName: signatureId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: requestId-index
            KeySchema:
              - AttributeName: requestId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Signature Requests Table - with tenant GSI
    SignatureRequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SIGNATURE_REQUESTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Surveys Table - with tenant GSI
    SurveysTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SURVEYS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: surveyId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: surveyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Inbox Messages Table
    InboxTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.INBOX_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: recipientId
            AttributeType: S
          - AttributeName: messageId
            AttributeType: S
          - AttributeName: senderId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: recipientId
            KeyType: HASH
          - AttributeName: messageId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: senderId-createdAt-index
            KeySchema:
              - AttributeName: senderId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Vales de firma sin conexión.
    #
    # Reemplaza al PIN guardado en claro en el dispositivo: la persona desbloquea
    # con su PIN, con red, y el dispositivo se queda con vales de un solo uso. Acá
    # solo vive el HASH del vale, igual que con el token de sesión.
    ValesFirmaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.VALES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: valeHash
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
        KeySchema:
          - AttributeName: valeHash
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Resolución vale -> registro al sincronizar.
          - IndexName: valeHash-index
            KeySchema:
              - AttributeName: valeHash
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          # Revocación de los vales sin usar de una persona (desvinculación).
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Sessions Table - with TTL
    SessionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SESSIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: tokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Resolución token -> sesión en cada request autenticado. Antes era un
          # `Scan` de la tabla completa. Proyección acotada: el autorizador solo
          # necesita saber quién es y de qué empresa, no la sesión entera.
          - IndexName: tokenHash-index
            KeySchema:
              - AttributeName: tokenHash
                KeyType: HASH
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - sessionId
                - personaId
                - tenantId
                - expiresAt
                - activa
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

