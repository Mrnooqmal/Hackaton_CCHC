# Service fijo 'BuildAndServe'. Dev y Prod se deployan por --stage (dev|prod)
service: BuildAndServe

plugins:
  - serverless-prune-plugin
  - serverless-offline

custom:
  prune:
    automatic: true
    number: 2
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3002
  # Orígenes que pueden hablarle a los buckets desde un navegador. El de
  # producción es el CloudFront de la aplicación; en dev se agregan los de
  # desarrollo local.
  # Los logs guardaban peticiones para siempre. 90 días en producción alcanza
  # para investigar un incidente; 14 en dev, para depurar la semana. Sin esto, el
  # dato personal que pase por un log sobrevive a cualquier política de retención.
  logRetention:
    prod: 90
    dev: 14

  # A dónde llegan las alarmas de operación. Es una casilla personal mientras el
  # equipo no tenga una de grupo; cambiarla acá y desplegar basta, pero la nueva
  # dirección debe confirmar la suscripción por correo antes de recibir nada.
  destinatarioAlertas: ${env:ALERTAS_EMAIL, 'atorres@thecodecookers.cl'}

  # Cada backend acepta el frontend de su ambiente (D-20). El de dev sale de la
  # salida del stack del frontend, así que ese stack se despliega primero. Dev ya
  # no acepta la URL de producción: QA prueba en su distribución.
  # Producción sale en su dominio (D-21). La URL de CloudFront sigue aceptada
  # durante la transición: quien tenga un enlace viejo o la app abierta.
  frontendUrl:
    prod: https://buildandserve.cl
    dev: https://${cf:BuildAndServe-frontend.DominioDistribucionDev}
  corsOrigins:
    prod:
      - https://buildandserve.cl
      - https://d30jksx91fodea.cloudfront.net
    dev:
      - https://${cf:BuildAndServe-frontend.DominioDistribucionDev}
      - http://localhost:5173
      - http://localhost:3000

  # Dos buckets, y la diferencia entre ellos es de consecuencias, no de orden:
  # lo que entra en `evidencia` no se puede borrar durante cinco años. La regla
  # para decidir dónde va cada archivo vive en `lib/almacenamiento.js`.
  evidenciaBucketName: buildandserve-evidencia-${self:provider.stage}
  trabajoBucketName: buildandserve-trabajo-${self:provider.stage}
  deletionPolicies:
    prod: Retain
  deletionPolicy: ${self:custom.deletionPolicies.${self:provider.stage}, 'Delete'}
  # Cifrado en reposo de TODAS las tablas con la clave propia (ClaveDatos), no
  # con la llave propiedad de AWS: su uso queda en CloudTrail y se puede revocar.
  # Antes del 28 de septiembre de 2026 las 17 tablas usaban la de AWS. RUT, salud
  # y snapshots ya iban además cifrados por campo (D-10); esto cubre el resto
  # (nombres, correos, cargos, firmas). Cambiarlo es en caliente: no reemplaza
  # tablas ni corta el servicio.
  cifradoTablas:
    SSEEnabled: true
    SSEType: KMS
    KMSMasterKeyId:
      Fn::GetAtt: [ClaveDatos, Arn]

provider:
  name: aws
  # Node 24 LTS (soporte hasta abril de 2028). nodejs18.x deja de aceptar
  # actualizaciones de funciones el 3 de marzo de 2027. La versión local y la de
  # CI se fijan en `.nvmrc` y en `engines` de cada package.json: las tres deben
  # moverse juntas.
  runtime: nodejs24.x
  # Sin versiones de Lambda. Serverless crea un AWS::Lambda::Version por función
  # en cada deploy (77 recursos), y el stack llegó a 512 contra el máximo de 500
  # de CloudFormation. Nada las usa: no hay alias ni concurrencia aprovisionada,
  # nadie referencia un ARN calificado, y `serverless rollback` vuelve a un
  # artefacto de S3, no a una versión. Tenían DeletionPolicy: Retain, así que
  # sacarlas del stack no borra ninguna. Ver D-16.
  versionFunctions: false
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    # --- Multi-Tenant Core Tables ---
    TENANTS_TABLE: ${self:service}-tenants-${self:provider.stage}
    OBRAS_TABLE: ${self:service}-obras-${self:provider.stage}
    PERSONAS_TABLE: ${self:service}-personas-${self:provider.stage}
    # --- Operational Tables ---
    SIGNATURE_REQUESTS_TABLE: ${self:service}-signature-requests-${self:provider.stage}
    SIGNATURES_TABLE: ${self:service}-signatures-${self:provider.stage}
    SESSIONS_TABLE: ${self:service}-sessions-${self:provider.stage}
    VALES_TABLE: ${self:service}-vales-firma-${self:provider.stage}
    LICENCIAS_TABLE: ${self:service}-licencias-${self:provider.stage}
    SURVEYS_TABLE: ${self:service}-surveys-${self:provider.stage}
    INCIDENTS_TABLE: ${self:service}-incidents-${self:provider.stage}
    DOCUMENTS_TABLE: ${self:service}-documents-${self:provider.stage}
    ACTIVITIES_TABLE: ${self:service}-activities-${self:provider.stage}
    INBOX_TABLE: ${self:service}-inbox-${self:provider.stage}
    SUGGESTIONS_TABLE: ${self:service}-sugerencias-${self:provider.stage}
    AUSENCIAS_TABLE: ${self:service}-ausencias-${self:provider.stage}
    GOBERNANZA_TABLE: ${self:service}-gobernanza-${self:provider.stage}
    GOBERNANZA_HISTORIAL_TABLE: ${self:service}-gobernanza-historial-${self:provider.stage}
    AUDITORIA_ACCESOS_TABLE: ${self:service}-auditoria-accesos-${self:provider.stage}
    EPP_TABLE: ${self:service}-epp-${self:provider.stage}
    ESTRUCTURA_TABLE: ${self:service}-estructura-preventiva-${self:provider.stage}
    # --- Storage ---
    EVIDENCIA_BUCKET: ${self:custom.evidenciaBucketName}
    TRABAJO_BUCKET: ${self:custom.trabajoBucketName}
    INCIDENT_NOTIFICATION_TOPIC: ${self:service}-incident-notifications-${self:provider.stage}
    # --- External ---
    # Correo (lib/correo.js, D-21): remitente del dominio verificado, respuestas
    # a la casilla de contacto (reenvío de Cloudflare), y todo envío con el
    # conjunto de configuración que publica rebotes y quejas.
    SES_SENDER_EMAIL: no-responder@buildandserve.cl
    SES_REPLY_TO: contacto@buildandserve.cl
    SES_CONFIGURATION_SET: ${self:service}-${self:provider.stage}
    CORREOS_SUPRIMIDOS_TABLE: ${self:service}-correos-suprimidos-${self:provider.stage}
    # Colas de trabajo (lib/cola.js): carga masiva (D-24) y avisos del EventBus (D-25).
    CARGAS_TABLE: ${self:service}-cargas-${self:provider.stage}
    CARGAS_QUEUE_URL: !Ref CargasQueue
    EVENTOS_QUEUE_URL: !Ref EventosQueue
    # URL del frontend para construir enlaces (ej. recuperación de contraseña).
    # No es secreto (URL pública), así que el default apunta a la demo en CloudFront
    # para que funcione aunque no se cargue el .env. Overridable por env var.
    FRONTEND_URL: ${env:FRONTEND_URL, self:custom.frontendUrl.${self:provider.stage}}
    # --- Credenciales (PIN y contraseña) ---
    # El PIN y la contraseña se guardan con scrypt. `ln` es log2 del costo: 15
    # son 32 MB y ~180 ms por verificación en esta Lambda (medido, ver
    # docs/gobernanza-y-seguridad-de-datos.md, D-7). Subirlo es cambiar este
    # número y desplegar: cada hash guarda con qué costo se hizo y se actualiza
    # solo la próxima vez que su dueño entra.
    CREDENCIAL_SCRYPT_LN: ${env:CREDENCIAL_SCRYPT_LN, '15'}
    # Acá va el NOMBRE del parámetro, nunca el valor: la pimienta se lee en
    # ejecución desde SSM (SecureString cifrado con la CMK). Resolverla al
    # desplegar la dejaría escrita en claro dentro de la plantilla de
    # CloudFormation, que es justo de donde se la quiere sacar.
    CREDENCIAL_PEPPER_PARAM: /${self:service}/${self:provider.stage}/credencial-pepper
    CREDENCIAL_PEPPER_V: ${env:CREDENCIAL_PEPPER_V, '1'}
    # --- Cifrado de campo (D-10: RUT y salud) ---
    # Igual criterio que la pimienta de credenciales: el NOMBRE del parámetro,
    # nunca el valor, y se lee en ejecución para que no quede escrito en claro
    # en la plantilla de CloudFormation. Llave separada de CREDENCIAL_PEPPER:
    # protege el HMAC del RUT, no las credenciales, y no se rota junto con ella.
    CAMPO_HMAC_KEY_PARAM: /${self:service}/${self:provider.stage}/campo-hmac-key
    CAMPO_HMAC_KEY_V: ${env:CAMPO_HMAC_KEY_V, '1'}
    # La CMK del sistema (`ClaveDatos`), para el cifrado de sobre. Es un id, no
    # un secreto: puede ir resuelto en la plantilla sin problema.
    CAMPO_CIFRADO_KMS_KEY_ID: !Ref ClaveDatos
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    # --- Gating de alta de empresas (Fase 1: PIN estático) ---
    # Código de habilitación requerido para crear una empresa via /tenants/setup.
    # El valor vive en el .env de Backend (TENANT_SIGNUP_CODE). Si queda vacío, no se gatea.
    TENANT_SIGNUP_CODE: ${env:TENANT_SIGNUP_CODE, ''}

  logRetentionInDays: ${self:custom.logRetention.${self:provider.stage}, self:custom.logRetention.dev}

  httpApi:
    # Autorizador de sesión. Se referencia explícitamente en cada ruta privada.
    # La lista de rutas públicas está declarada en `tests/rutas-autenticadas.test.js`,
    # que falla la build si aparece una ruta sin autorizador fuera de esa lista.
    authorizers:
      # El nombre es `sesionUsuario` y no `sesion` por un incidente de despliegue:
      # un rollback de CloudFormation sacó el autorizador de la plantilla de `dev`
      # pero lo dejó vivo en API Gateway, y desde entonces ningún despliegue podía
      # volver a crearlo ("Authorizer name must be unique"). Renombrarlo permite
      # crear el nuevo SIN dejar en ningún momento las rutas sin autorizador, que
      # era la alternativa. No lo vuelvas a llamar `sesion` sin comprobar antes que
      # no exista un autorizador huérfano con ese nombre en la API.
      sesionUsuario:
        type: request
        functionName: sesionAuthorizer
        identitySource:
          - $request.header.Authorization
        # 60s de caché por token: evita una lectura de DynamoDB por request, al
        # precio de que un cierre de sesión tarde hasta un minuto en propagarse.
        resultTtlInSeconds: 60
        enableSimpleResponses: true
    cors:
      # Acotado a los orígenes de la aplicación, igual que los buckets. No es una
      # defensa contra un atacante con un script —CORS no gobierna eso— sino
      # contra que una página cualquiera haga peticiones a la API desde el
      # navegador de quien la visite.
      allowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}, self:custom.corsOrigins.prod}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      # El navegador cachea el preflight 10 minutos: sin esto vuelve a preguntar
      # cada pocos segundos y cada pregunta es una petición más.
      maxAge: 600
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            # Lectura por lotes con el mismo alcance que GetItem. La usa el
            # listado de encuestas para leer de la tabla lo que `tenantId-index`
            # no proyecta; sin esta línea el doble de pruebas pasa y AWS niega.
            - dynamodb:BatchGetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            # --- Multi-Tenant Core ---
            - !GetAtt TenantsTable.Arn
            - !Sub ${TenantsTable.Arn}/index/*
            - !GetAtt ObrasTable.Arn
            - !Sub ${ObrasTable.Arn}/index/*
            - !GetAtt PersonasTable.Arn
            - !Sub ${PersonasTable.Arn}/index/*
            # --- Operational ---
            - !GetAtt SignatureRequestsTable.Arn
            - !Sub ${SignatureRequestsTable.Arn}/index/*
            - !GetAtt SignaturesTable.Arn
            - !Sub ${SignaturesTable.Arn}/index/*
            - !GetAtt SessionsTable.Arn
            # El índice `tokenHash-index` es el que resuelve el token en cada
            # request: sin esta línea el autorizador niega todo, porque falla la
            # consulta y el fallo se traduce en denegación.
            - !Sub ${SessionsTable.Arn}/index/*
            - !GetAtt ValesFirmaTable.Arn
            - !Sub ${ValesFirmaTable.Arn}/index/*
            # Licencias de alta. Sin `/index/*`: la tabla no tiene índices.
            - !GetAtt LicenciasTable.Arn
            - !GetAtt SurveysTable.Arn
            - !Sub ${SurveysTable.Arn}/index/*
            - !GetAtt IncidentsTable.Arn
            - !Sub ${IncidentsTable.Arn}/index/*
            - !GetAtt InboxTable.Arn
            - !Sub ${InboxTable.Arn}/index/*
            - !GetAtt ActivitiesTable.Arn
            - !Sub ${ActivitiesTable.Arn}/index/*
            - !GetAtt DocumentsTable.Arn
            - !Sub ${DocumentsTable.Arn}/index/*
            - !GetAtt SuggestionsTable.Arn
            - !Sub ${SuggestionsTable.Arn}/index/*
            - !GetAtt AusenciasTable.Arn
            - !Sub ${AusenciasTable.Arn}/index/*
            - !GetAtt EppTable.Arn
            - !GetAtt EstructuraPreventivaTable.Arn

        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        # Encolar avisos del EventBus y filas de la carga masiva (D-24, D-25).
        # Consumirlas (Receive/Delete) lo hace el mapeo de eventos del trabajador.
        - Effect: Allow
          Action: [sqs:SendMessage]
          Resource:
            - !GetAtt CargasQueue.Arn
            - !GetAtt EventosQueue.Arn
        - Effect: Allow
          Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:BatchWriteItem]
          Resource:
            - !GetAtt CargasTable.Arn
            - !Sub ${CargasTable.Arn}/index/*
        # Antes de cada envío: ¿la dirección rebotó o se quejó? Solo leer; marcar
        # lo hace únicamente la función de eventos de correo, con su rol.
        - Effect: Allow
          Action: [dynamodb:GetItem]
          Resource: !GetAtt CorreosSuprimidosTable.Arn
        # Gobernanza (Ley 21.719): solicitudes y planes se crean y se actualizan,
        # pero NO se borran. El historial, además, tampoco se actualiza: solo se
        # le agregan eventos. Es la evidencia de que la empresa cumplió, y la
        # garantía de que solo crece está en estos permisos, no en la disciplina
        # del código (ver tests/gobernanza-permisos.test.js).
        - Effect: Allow
          Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
          Resource:
            - !GetAtt GobernanzaTable.Arn
        - Effect: Allow
          Action: [dynamodb:Query, dynamodb:PutItem]
          Resource:
            - !GetAtt GobernanzaHistorialTable.Arn
            # Auditoría de acceso a datos de salud (D-18): solo agregar y leer.
            - !GetAtt AuditoriaAccesosTable.Arn
            - !Sub ${AuditoriaAccesosTable.Arn}/index/*
        # Evidencia: se escribe y se lee, pero NO se borra. El permiso de borrado
        # no está por omisión y no por olvido: el bloqueo de objetos lo impediría
        # igual, y así el intento falla donde se entiende por qué.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource:
            - !Sub 'arn:aws:s3:::${self:custom.evidenciaBucketName}/*'
        - Effect: Allow
          Action:
            - s3:PutObject
            # Etiquetar al subir es lo que hace que el estampado caduque en un día:
            # sin este permiso el objeto se sube igual, pero sin etiqueta, y se
            # queda para siempre.
            - s3:PutObjectTagging
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub 'arn:aws:s3:::${self:custom.trabajoBucketName}/*'
        # Sin esto, un objeto cifrado con la clave propia no se puede ni escribir
        # ni leer: la CMK no es solo una casilla de configuración.
        - Effect: Allow
          Action:
            - kms:Encrypt
            - kms:Decrypt
            - kms:ReEncrypt*
            - kms:GenerateDataKey*
            - kms:DescribeKey
          Resource:
            - !GetAtt ClaveDatos.Arn
        # Solo la pimienta, solo lectura. El descifrado lo cubre el permiso de
        # KMS de más arriba, porque el parámetro está cifrado con la misma CMK.
        - Effect: Allow
          Action:
            - ssm:GetParameter
          Resource:
            - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${self:service}/${self:provider.stage}/credencial-pepper'
            - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${self:service}/${self:provider.stage}/campo-hmac-key'
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - !Ref IncidentNotificationTopic

package:
  individually: false
  excludeDevDependencies: true
  patterns:
    - '!node_modules/.prisma/**'
    - '!node_modules/@prisma/**'
    - '!node_modules/.bin/**'
    - '!tests/**'
    - '!**/__tests__/**'

functions:
  # ========================================
  # AUTORIZADOR DE SESIÓN
  # ========================================
  # Resuelve el token de sesión y entrega `personaId` y `tenantId` a los
  # handlers. No lleva eventos: lo invoca API Gateway, no una ruta.
  sesionAuthorizer:
    handler: handlers/auth/authorizer.autorizar

  # ========================================
  # TENANTS (Empresas / Multi-Tenant)
  # ========================================
  tenantsModule:
    handler: handlers/tenants-module/handler.tenantsHandler
    # El alta de empresa (/tenants/setup) encadena varias escrituras en
    # DynamoDB más el envío síncrono del correo de bienvenida por SES. El
    # default de 6s se queda corto y el timeout no es un fallo real: el envío
    # de correo ya está protegido con try/catch y no revierte la creación.
    # 29s y no 30: HTTP API tiene un tope duro de 30s en el integration timeout,
    # así que igualarlo deja una carrera entre Lambda y el Gateway cortando
    # primero. Un segundo de margen evita el 504 con Lambda ya resuelto.
    timeout: 29
    events:
      - httpApi:
          path: /tenants
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /tenants/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # El alta de empresas YA NO ES UN ENDPOINT.
  #
  # Estaba abierta (`POST /tenants/setup`) tras un código compartido que además
  # estaba vacío en los dos ambientes. Un código compartido no dice quién lo usó
  # y no había a quién pedirle la autorización: todas las sesiones pertenecen a
  # una empresa, así que no existe un administrador de plataforma que pueda crear
  # la primera. Ahora la da de alta el operador con `scripts/crear-empresa.js`,
  # donde la autorización es IAM y cada escritura queda en CloudTrail.
  #
  # Con el alta fuera, también se retiran las dos consultas públicas que solo
  # servían a ese formulario (`GET /tenants/validate` y `GET /personas/validate`):
  # respondían sin sesión si una empresa o un RUT ya existían. `/personas/validate`
  # sigue disponible con sesión a través del módulo de personas, que es desde
  # donde la usa el alta de una persona.

  # ========================================
  # OBRAS (Proyectos de Construcción)
  # ========================================
  # Estructura preventiva (DS 44): organos, integrantes y reuniones. Modulo propio
  # porque los organos viven tanto a nivel empresa como de obra.
  estructuraModule:
    handler: handlers/estructura-module/handler.estructuraHandler
    events:
      - httpApi:
          path: /estructura
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /estructura/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  obrasModule:
    handler: handlers/obras-module/handler.obrasHandler
    events:
      - httpApi:
          path: /obras
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /obras/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # ========================================
  # PERSONAS (Identidad Unificada - reemplaza Users + Workers)
  # ========================================
  personasModule:
    handler: handlers/personas-module/handler.personasHandler
    events:
      - httpApi:
          path: /personas
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /personas/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # Auth (Autenticación)
  authLogin:
    handler: handlers/auth/handler.login
    # 1769 MB es donde Lambda entrega un vCPU completo. Acá no es por memoria sino
    # por CPU: scrypt es de un solo hilo, así que la verificación pasa de ~195 ms
    # a ~112 ms (medido en dev). Y como se factura por GB-ms, cuesta casi lo
    # mismo: 214 GB-ms contra 225. Se paga un 5% más por un 40% menos de espera
    # en la pantalla de quien está firmando en terreno.
    memorySize: 1769
    events:
      - httpApi:
          path: /auth/login
          method: POST

  authSelectTenant:
    handler: handlers/auth/handler.selectTenant
    events:
      - httpApi:
          path: /auth/select-tenant
          method: POST

  authChangePassword:
    handler: handlers/auth/handler.changePassword
    memorySize: 1769   # ver authLogin
    events:
      - httpApi:
          path: /auth/change-password
          method: POST
          authorizer:
            name: sesionUsuario

  authForgotPassword:
    handler: handlers/auth/handler.forgotPassword
    events:
      - httpApi:
          path: /auth/forgot-password
          method: POST

  authResetPassword:
    handler: handlers/auth/handler.resetPassword
    memorySize: 1769   # ver authLogin
    events:
      - httpApi:
          path: /auth/reset-password
          method: POST

  authLogout:
    handler: handlers/auth/handler.logout
    events:
      - httpApi:
          path: /auth/logout
          method: POST
          authorizer:
            name: sesionUsuario

  authMe:
    handler: handlers/auth/handler.me
    events:
      - httpApi:
          path: /auth/me
          method: GET
          authorizer:
            name: sesionUsuario

  authValidateToken:
    handler: handlers/auth/handler.validateToken
    events:
      - httpApi:
          path: /auth/validate-token
          method: POST


  # ========================================
  # SIGNATURE REQUESTS (Solicitudes de Firma)
  # ========================================
  createSignatureRequest:
    handler: handlers/signature-requests/handler.create
    events:
      - httpApi:
          path: /signature-requests
          method: POST
          authorizer:
            name: sesionUsuario

  listSignatureRequests:
    handler: handlers/signature-requests/handler.list
    events:
      - httpApi:
          path: /signature-requests
          method: GET
          authorizer:
            name: sesionUsuario

  getSignatureRequest:
    handler: handlers/signature-requests/handler.get
    events:
      - httpApi:
          path: /signature-requests/{id}
          method: GET
          authorizer:
            name: sesionUsuario

  getPendingByWorker:
    handler: handlers/signature-requests/handler.getPendingByWorker
    events:
      - httpApi:
          path: /signature-requests/pending/{workerId}
          method: GET
          authorizer:
            name: sesionUsuario

  getHistoryByWorker:
    handler: handlers/signature-requests/handler.getHistoryByWorker
    events:
      - httpApi:
          path: /signature-requests/history/{workerId}
          method: GET
          authorizer:
            name: sesionUsuario

  cancelSignatureRequest:
    handler: handlers/signature-requests/handler.cancel
    events:
      - httpApi:
          path: /signature-requests/{id}/cancel
          method: POST
          authorizer:
            name: sesionUsuario

  getSignatureRequestStats:
    handler: handlers/signature-requests/handler.getStats
    events:
      - httpApi:
          path: /signature-requests/stats
          method: GET
          authorizer:
            name: sesionUsuario

  # Activities (Actividades)
  listActivities:
    handler: handlers/activities/handler.list
    events:
      - httpApi:
          path: /activities
          method: GET
          authorizer:
            name: sesionUsuario

  createActivity:
    handler: handlers/activities/handler.create
    events:
      - httpApi:
          path: /activities
          method: POST
          authorizer:
            name: sesionUsuario

  getActivity:
    handler: handlers/activities/handler.get
    events:
      - httpApi:
          path: /activities/{id}
          method: GET
          authorizer:
            name: sesionUsuario

  planActivities:
    handler: handlers/activities/handler.plan
    events:
      - httpApi:
          path: /activities/plan
          method: POST
          authorizer:
            name: sesionUsuario

  patchActivity:
    handler: handlers/activities/handler.patch
    events:
      - httpApi:
          path: /activities/{id}
          method: PATCH
          authorizer:
            name: sesionUsuario

  registerActivityAttendance:
    handler: handlers/activities/handler.registerAttendance
    events:
      - httpApi:
          path: /activities/{id}/attendance
          method: POST
          authorizer:
            name: sesionUsuario

  getActivityStats:
    handler: handlers/activities/handler.getStats
    events:
      - httpApi:
          path: /activities/stats
          method: GET
          authorizer:
            name: sesionUsuario

  # Ausencias / permisos del día (control de asistencia §6)
  createAusencia:
    handler: handlers/ausencias/handler.create
    events:
      - httpApi:
          path: /ausencias
          method: POST
          authorizer:
            name: sesionUsuario

  listAusencias:
    handler: handlers/ausencias/handler.list
    events:
      - httpApi:
          path: /ausencias
          method: GET
          authorizer:
            name: sesionUsuario

  removeAusencia:
    handler: handlers/ausencias/handler.remove
    events:
      - httpApi:
          path: /ausencias
          method: DELETE
          authorizer:
            name: sesionUsuario

  # Scheduler de alertas de asistencia (§6): avisa al inbox de los responsables
  # cuando una charla superó su hora de término sin cerrarse, y a mediodía si
  # aún hay convocados sin firmar. Idempotente por día.
  checkActivityAlerts:
    handler: handlers/scheduler/handler.checkActivityAlerts
    events:
      - schedule: rate(30 minutes)

  # Recordatorios de estructura preventiva (DS 44). Diario a las 13:00 UTC
  # (manana en Chile): son hitos de calendario, no estados que cambien en el dia.
  checkEstructuraAlerts:
    handler: handlers/scheduler/handler.checkEstructuraAlerts
    timeout: 120
    events:
      - schedule: cron(0 13 * * ? *)

  # Recordatorio de revisión anual del Reglamento Interno / Política (Art. 57 inc. 5).
  # Diario a las 13:10 UTC; avisa al inbox de la línea de mando, idempotente.
  checkDocumentReviewAlerts:
    handler: handlers/scheduler/handler.checkDocumentReviewAlerts
    timeout: 120
    events:
      - schedule: cron(10 13 * * ? *)

  # Retención de datos personales (D-2, Ley 21.719): calcula por empresa qué
  # venció y qué se conserva, guarda el plan y extiende los bloqueos de S3 de la
  # evidencia que debe seguir guardada. No suprime nada. Rol propio y mínimo
  # (RolGobernanza): el rol compartido de las demás funciones no puede tocar
  # bloqueos, y este no puede escribir fuera de la tabla de gobernanza.
  retencionDiaria:
    handler: handlers/gobernanza/retencion.retencionDiaria
    role: RolGobernanza
    timeout: 600
    memorySize: 1024
    events:
      - schedule: cron(30 7 * * ? *)

  # Documents (Documentos)
  listDocuments:
    handler: handlers/documents/handler.list
    events:
      - httpApi:
          path: /documents
          method: GET
          authorizer:
            name: sesionUsuario

  createDocument:
    handler: handlers/documents/handler.create
    events:
      - httpApi:
          path: /documents
          method: POST
          authorizer:
            name: sesionUsuario

  getDocument:
    handler: handlers/documents/handler.get
    events:
      - httpApi:
          path: /documents/{id}
          method: GET
          authorizer:
            name: sesionUsuario

  updateDocument:
    handler: handlers/documents/handler.update
    events:
      - httpApi:
          path: /documents/{id}
          method: PUT
          authorizer:
            name: sesionUsuario

  deleteDocument:
    handler: handlers/documents/handler.remove
    events:
      - httpApi:
          path: /documents/{id}
          method: DELETE
          authorizer:
            name: sesionUsuario

  documentNuevaVersion:
    handler: handlers/documents/handler.nuevaVersion
    events:
      - httpApi:
          path: /documents/{id}/nueva-version
          method: POST
          authorizer:
            name: sesionUsuario

  # Versionado de documentos corporativos (Reglamento, Política): no tienen un
  # documentId único, se reparten en copias por persona. Va antes que
  # /documents/{id}/... porque 'corporativo' no es un id.
  documentNuevaVersionCorporativa:
    handler: handlers/documents/handler.nuevaVersionCorporativa
    events:
      - httpApi:
          path: /documents/corporativo/nueva-version
          method: POST
          authorizer:
            name: sesionUsuario

  # Constancia de envio declarado (Art. 57 inc. 2 y equivalentes). Se suma al
  # mismo array difusiones[] que escribe EventBus al publicar una version.
  registrarDifusionDocumento:
    handler: handlers/documents/handler.registrarDifusion
    events:
      - httpApi:
          path: /documents/{id}/difusion
          method: POST
          authorizer:
            name: sesionUsuario

  assignDocument:
    handler: handlers/documents/handler.assign
    events:
      - httpApi:
          path: /documents/{id}/assign
          method: POST
          authorizer:
            name: sesionUsuario

  signDocument:
    handler: handlers/documents/handler.sign
    events:
      - httpApi:
          path: /documents/{id}/sign
          method: POST
          authorizer:
            name: sesionUsuario

  signBulkDocuments:
    handler: handlers/documents/handler.signBulk
    events:
      - httpApi:
          path: /documents/{id}/sign-bulk
          method: POST
          authorizer:
            name: sesionUsuario

  signAssistedDocument:
    handler: handlers/documents/handler.signAssisted
    events:
      - httpApi:
          path: /documents/{id}/sign-assisted
          method: POST
          authorizer:
            name: sesionUsuario

  downloadSignedDocument:
    handler: handlers/documents/handler.downloadFirmado
    events:
      - httpApi:
          path: /documents/{id}/download-firmado
          method: GET
          authorizer:
            name: sesionUsuario

  # ========================================
  # SIGNATURES (Firmas Digitales)
  # ========================================
  createSignature:
    handler: handlers/signatures/handler.create
    memorySize: 1769   # ver authLogin
    events:
      - httpApi:
          path: /signatures
          method: POST
          authorizer:
            name: sesionUsuario

  createEnrollmentSignature:
    handler: handlers/signatures/handler.createEnrollment
    events:
      - httpApi:
          path: /signatures/enroll
          method: POST
          authorizer:
            name: sesionUsuario

  getSignature:
    handler: handlers/signatures/handler.get
    events:
      - httpApi:
          path: /signatures/{id}
          method: GET
          authorizer:
            name: sesionUsuario

  getSignaturesByWorker:
    handler: handlers/signatures/handler.getByWorker
    events:
      - httpApi:
          path: /signatures/worker/{workerId}
          method: GET
          authorizer:
            name: sesionUsuario

  getSignaturesByRequest:
    handler: handlers/signatures/handler.getByRequest
    events:
      - httpApi:
          path: /signatures/request/{requestId}
          method: GET
          authorizer:
            name: sesionUsuario

  verifySignatureByToken:
    handler: handlers/signatures/handler.verifyByToken
    events:
      - httpApi:
          path: /signatures/verify/{token}
          method: GET

  disputeSignature:
    handler: handlers/signatures/handler.dispute
    events:
      - httpApi:
          path: /signatures/{id}/dispute
          method: POST
          authorizer:
            name: sesionUsuario

  resolveSignatureDispute:
    handler: handlers/signatures/handler.resolve
    events:
      - httpApi:
          path: /signatures/{id}/resolve
          method: PUT
          authorizer:
            name: sesionUsuario

  # Preflight CORS de las rutas de módulo.
  #
  # Los módulos declaran su prefijo con `method: any`, y ese `any` captura también
  # el `OPTIONS` del preflight, que pasó a responder 401 al poner el autorizador:
  # un preflight nunca lleva `Authorization`. El navegador entonces bloquea la
  # petición real y la aplicación ve "Failed to fetch" en vez de un 401 legible.
  #
  # Una ruta con método exacto gana sobre `ANY`, así que estas responden el
  # preflight sin autorizador. No leen nada ni distinguen recursos: 204 y las
  # cabeceras de CORS. Las rutas con método explícito (documents, signatures,
  # activities…) no las necesitan: al no existir ruta OPTIONS, las responde API
  # Gateway por su cuenta.
  # ── Onboarding con licencia de un solo uso ─────────────────────────────────
  # Las dos rutas son públicas porque quien las usa todavía no tiene sesión: su
  # empresa no existe. La credencial es el token del enlace. Están declaradas en
  # la lista blanca de `tests/rutas-autenticadas.test.js` con su razón, y con
  # límite de tasa propio (ver RouteSettings más abajo).
  onboardingValidarLicencia:
    handler: handlers/onboarding/handler.validarLicencia
    events:
      - httpApi:
          path: /onboarding/licencia/{token}
          method: GET

  onboardingCompletar:
    handler: handlers/onboarding/handler.completar
    # El alta hashea la contraseña del administrador con scrypt: mismo criterio
    # que el resto de las funciones que verifican credenciales.
    memorySize: 1769   # ver authLogin
    events:
      - httpApi:
          path: /onboarding/completar
          method: POST

  # Reportes de la CSP del frontend (modo solo reporte, ver handlers/csp). Es
  # pública porque la llama el navegador por su cuenta, sin sesión. En la lista
  # blanca de `tests/rutas-autenticadas.test.js`, con cuerpo acotado en el
  # handler y límite de tasa propio en RouteSettings.
  cspReporte:
    handler: handlers/csp/handler.reportar
    memorySize: 256
    timeout: 5
    events:
      - httpApi:
          path: /csp/reporte
          method: POST

  corsPreflight:
    handler: handlers/cors/handler.preflight
    events:
      # Los reportes de `report-to` pueden llegar con preflight CORS.
      - httpApi:
          path: /csp/reporte
          method: options
      # Onboarding: sin estas dos, el navegador recibe 401 en el preflight y el
      # formulario falla con "failed to fetch" sin decir por qué. Ya pasó una vez.
      - httpApi:
          path: /onboarding/licencia/{token}
          method: options
      - httpApi:
          path: /onboarding/completar
          method: options
      - httpApi:
          path: /tenants
          method: options
      - httpApi:
          path: /tenants/{proxy+}
          method: options
      - httpApi:
          path: /estructura
          method: options
      - httpApi:
          path: /estructura/{proxy+}
          method: options
      - httpApi:
          path: /obras
          method: options
      - httpApi:
          path: /obras/{proxy+}
          method: options
      - httpApi:
          path: /personas
          method: options
      - httpApi:
          path: /personas/{proxy+}
          method: options
      - httpApi:
          path: /incidents
          method: options
      - httpApi:
          path: /incidents/{proxy+}
          method: options
      - httpApi:
          path: /inbox
          method: options
      - httpApi:
          path: /inbox/{proxy+}
          method: options
      - httpApi:
          path: /gobernanza/{proxy+}
          method: options

  # Habilita la firma sin conexión: la persona valida su PIN una vez, con red, y
  # recibe vales de un solo uso. Ver lib/services/ValeFirmaService.js.
  valesEmitir:
    handler: handlers/vales/handler.emitir
    memorySize: 1769   # ver authLogin
    events:
      - httpApi:
          path: /firmas/vales
          method: post
          authorizer:
            name: sesionUsuario

  # Confirma o rechaza una firma sincronizada con un vale vencido.
  signatureRevisar:
    handler: handlers/signatures/handler.revisar
    events:
      - httpApi:
          path: /signatures/{id}/revision
          method: put
          authorizer:
            name: sesionUsuario

  listSignatureDisputes:
    handler: handlers/signatures/handler.listDisputes
    events:
      - httpApi:
          path: /signatures/disputes
          method: GET
          authorizer:
            name: sesionUsuario

  # ========================================
  # UPLOADS (Subida de archivos a S3)
  # ========================================
  getUploadUrl:
    handler: handlers/uploads/handler.getUploadUrl
    events:
      - httpApi:
          path: /uploads/presigned-url
          method: POST
          authorizer:
            name: sesionUsuario

  getDownloadUrl:
    handler: handlers/uploads/handler.getDownloadUrl
    events:
      - httpApi:
          path: /uploads/download-url
          method: POST
          authorizer:
            name: sesionUsuario

  confirmUpload:
    handler: handlers/uploads/handler.confirmUpload
    events:
      - httpApi:
          path: /uploads/confirm
          method: POST
          authorizer:
            name: sesionUsuario

  deleteUpload:
    handler: handlers/uploads/handler.deleteFile
    events:
      - httpApi:
          path: /uploads/{fileKey}
          method: DELETE
          authorizer:
            name: sesionUsuario

  getBatchDownloadUrls:
    handler: handlers/uploads/handler.getBatchDownloadUrls
    events:
      - httpApi:
          path: /uploads/batch-download-urls
          method: POST
          authorizer:
            name: sesionUsuario

  # Transcripción de audio (dictado del relato al reportar un incidente)
  aiTranscribeAudio:
    handler: handlers/ai/handler.transcribeAudio
    timeout: 60
    events:
      - httpApi:
          path: /ai/transcribe
          method: POST
          authorizer:
            name: sesionUsuario

  # Surveys (Encuestas)
  createSurvey:
    handler: handlers/surveys/handler.create
    events:
      - httpApi:
          path: /surveys
          method: POST
          authorizer:
            name: sesionUsuario

  listSurveys:
    handler: handlers/surveys/handler.list
    events:
      - httpApi:
          path: /surveys
          method: GET
          authorizer:
            name: sesionUsuario

  getSurvey:
    handler: handlers/surveys/handler.get
    events:
      - httpApi:
          path: /surveys/{id}
          method: GET
          authorizer:
            name: sesionUsuario

  updateSurveyResponse:
    handler: handlers/surveys/handler.updateResponseStatus
    events:
      - httpApi:
          path: /surveys/{id}/responses/{workerId}
          method: POST
          authorizer:
            name: sesionUsuario

  incidentsModule:
    handler: handlers/incidents-module/handler.incidentsHandler
    events:
      - httpApi:
          path: /incidents
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /incidents/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # `POST /test-email` retirado: endpoint de prueba expuesto en producción que
  # permitía disparar correos desde el remitente verificado del sistema y
  # registraba RUT y contraseña temporal en CloudWatch. La función interna
  # `sendWelcomeEmail` la sigue usando el alta de empresa y no se toca.

  inboxModule:
    handler: handlers/inbox-module/handler.inboxHandler
    events:
      - httpApi:
          path: /inbox
          method: any
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /inbox/{proxy+}
          method: any
          authorizer:
            name: sesionUsuario

  # Derechos de los titulares (Ley 21.719): solicitudes, bloqueo temporal,
  # prórroga y respuesta, con historial que solo crece. Ver handlers/gobernanza.
  gobernanzaDerechos:
    handler: handlers/gobernanza/derechos.handler
    events:
      - httpApi:
          path: /gobernanza/{proxy+}
          method: GET
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /gobernanza/{proxy+}
          method: POST
          authorizer:
            name: sesionUsuario

  # Trabajador de las colas (D-24, D-25): avisos del EventBus y filas de la
  # carga masiva. Reporta por mensaje: SQS reintenta solo lo que falló.
  trabajadorCola:
    handler: handlers/cola/trabajador.handler
    timeout: 60
    memorySize: 1024
    events:
      - sqs:
          arn: !GetAtt EventosQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 5
      - sqs:
          arn: !GetAtt CargasQueue.Arn
          batchSize: 10
          functionResponseType: ReportBatchItemFailures
          maximumConcurrency: 5

  # Rebotes y quejas de SES (D-21): marca la dirección para no volver a
  # escribirle. Rol propio: es la única que escribe en la tabla de suprimidas.
  correoEventos:
    handler: handlers/correo/eventos.handler
    role: RolCorreoEventos
    timeout: 30
    events:
      - sns:
          arn: !Ref CorreoEventosTopic
          topicName: ${self:service}-correo-eventos-${self:provider.stage}

  # Lotes de supresión (D-15, D-17): proponer, aprobar y ejecutar, dos personas.
  # Rol propio: RolSupresion es el ÚNICO que puede borrar datos personales y
  # versiones de S3 con bypass de la retención, y solo esta función lo usa.
  gobernanzaLotes:
    handler: handlers/gobernanza/lotes.handler
    role: RolSupresion
    timeout: 300
    memorySize: 1024
    events:
      - httpApi:
          path: /gobernanza/lotes
          method: GET
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /gobernanza/lotes
          method: POST
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /gobernanza/lotes/{proxy+}
          method: GET
          authorizer:
            name: sesionUsuario
      - httpApi:
          path: /gobernanza/lotes/{proxy+}
          method: POST
          authorizer:
            name: sesionUsuario

  # Aviso diario de plazos de las solicitudes de los titulares (09:00 de Chile).
  alertasDerechos:
    handler: handlers/gobernanza/derechos.alertasDiarias
    timeout: 120
    events:
      - schedule: cron(0 12 * * ? *)

  # Suggestions (Sugerencias)
  createSuggestion:
    handler: handlers/suggestions/handler.create
    events:
      - httpApi:
          path: /suggestions
          method: POST
          authorizer:
            name: sesionUsuario

resources:
  # Límite de tasa. El de la API entera es generoso; el del onboarding no, porque
  # sus dos rutas son públicas y la de completar crea una empresa. Con esto, un
  # enlace filtrado no habilita a martillar el alta, y probar tokens al azar deja
  # de ser gratis.
  #
  # Los límites son por ruta y por ambiente, no por origen: API Gateway no
  # distingue quién llama en una ruta sin autenticar. Lo que se protege es el
  # sistema, no a un llamante de otro.
  extensions:
    HttpApiStage:
      # Sin esto, CloudFormation actualiza el stage ANTES de crear las rutas y
      # falla con "Unable to find Route by key POST /onboarding/completar": un
      # límite de tasa no se puede declarar sobre una ruta que todavía no existe.
      DependsOn:
        - HttpApiRouteGetOnboardingLicenciaTokenVar
        - HttpApiRoutePostOnboardingCompletar
        - HttpApiRoutePostCspReporte
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 200
          ThrottlingRateLimit: 100
        RouteSettings:
          'GET /onboarding/licencia/{token}':
            ThrottlingBurstLimit: 5
            ThrottlingRateLimit: 2
          'POST /onboarding/completar':
            ThrottlingBurstLimit: 3
            ThrottlingRateLimit: 1
          # Pública y la llama cualquier navegador: estricta. Un reporte por
          # violación y por página; con la política bien armada, casi nunca llega
          # nada. Si una violación masiva real se pierde por el límite, basta con
          # las que sí entran para ver cuál es.
          'POST /csp/reporte':
            ThrottlingBurstLimit: 10
            ThrottlingRateLimit: 5

  Resources:
    # ==========================================
    # CLAVE PROPIA (KMS)
    # ==========================================
    # Los buckets ya cifraban con la clave que gestiona AWS. Una clave propia no
    # agrega confidencialidad frente a un tercero —AES256 ya cifra— sino dos cosas
    # que antes no existían: poder revocar el acceso a los datos cortando la
    # clave, y que cada uso quede registrado en CloudTrail.
    #
    # `BucketKeyEnabled` en los buckets evita una llamada a KMS por objeto, que es
    # lo que vuelve caro este cifrado cuando se hace mal.
    ClaveDatos:
      Type: AWS::KMS::Key
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        Description: Clave de los datos de Build & Serve (${self:provider.stage})
        EnableKeyRotation: true
        KeyPolicy:
          Version: '2012-10-17'
          Statement:
            # Sin esta declaración la clave queda fuera del alcance de la propia
            # cuenta y no hay forma de recuperarla.
            - Sid: Administracion desde la cuenta
              Effect: Allow
              Principal:
                AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
              Action: 'kms:*'
              Resource: '*'
            - Sid: Uso desde S3
              Effect: Allow
              Principal:
                Service: s3.amazonaws.com
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: '*'

    ClaveDatosAlias:
      Type: AWS::KMS::Alias
      Properties:
        AliasName: alias/${self:service}-datos-${self:provider.stage}
        TargetKeyId: !Ref ClaveDatos

    # ==========================================
    # S3 BUCKETS
    # ==========================================
    # `evidencia` guarda lo que se le muestra a un fiscalizador; `trabajo`, lo que
    # se puede rehacer. La regla completa está en `lib/almacenamiento.js`.

    EvidenciaBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.evidenciaBucketName}
        # El bloqueo de objetos SOLO se puede habilitar al crear el bucket: si
        # algún día hay que quitarlo o cambiarlo, es un bucket nuevo y una
        # migración, no una edición de esta línea.
        ObjectLockEnabled: true
        ObjectLockConfiguration:
          ObjectLockEnabled: Enabled
          Rule:
            DefaultRetention:
              # GOVERNANCE y no COMPLIANCE a propósito: en modo cumplimiento no lo
              # levanta NADIE —ni la cuenta raíz, ni ante una orden judicial de
              # supresión, ni ante una carga masiva equivocada—. Un candado sin
              # llave es un riesgo, no una garantía.
              Mode: GOVERNANCE
              # Piso de cinco años desde la carga. El plazo real se cuenta desde el
              # término del vínculo laboral y lo calcula la aplicación sobre
              # `Persona.fechaTerminoVinculo`: son dos relojes distintos y este es
              # el de abajo (ver D-2 en docs/gobernanza-y-seguridad-de-datos.md).
              Years: 5
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !GetAtt ClaveDatos.Arn
              BucketKeyEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, HEAD]
              AllowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}, self:custom.corsOrigins.prod}
              ExposedHeaders: [ETag]
              MaxAge: 3000

    TrabajoBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        BucketName: ${self:custom.trabajoBucketName}
        VersioningConfiguration:
          Status: Enabled
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: aws:kms
                KMSMasterKeyID: !GetAtt ClaveDatos.Arn
              BucketKeyEnabled: true
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            # El PDF con el anexo de firmas se rehace en 244 ms desde el original y
            # las firmas: guardarlo más de un día es guardar basura.
            #
            # Se selecciona por ETIQUETA y no por prefijo. La clave del estampado es
            # `tenants/{empresa}/estampados/…` y un prefijo de S3 no puede saltarse
            # el tramo del medio: la primera versión de esta regla llevaba
            # `Prefix: ''`, o sea que habría borrado TODO el bucket cada día —logos,
            # plantillas y fotos de obra incluidos—. La etiqueta la pone el servidor
            # al subir el estampado (ver PdfStampingService.subirEstampado).
            - Id: estampados-efimeros
              Status: Enabled
              TagFilters:
                - Key: ciclo
                  Value: efimero
              ExpirationInDays: 1
              NoncurrentVersionExpirationInDays: 1
            # El resto (logos, plantillas, fotos) se conserva, pero sus versiones
            # viejas no tienen por qué acumularse para siempre.
            - Id: versiones-viejas
              Status: Enabled
              NoncurrentVersionExpirationInDays: 90
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, HEAD]
              AllowedOrigins: ${self:custom.corsOrigins.${self:provider.stage}, self:custom.corsOrigins.prod}
              ExposedHeaders: [ETag]
              MaxAge: 3000

    # Solo con TLS. Las URL firmadas y el SDK ya usan https, pero S3 también
    # acepta http: una URL firmada editada a http:// funcionaba y el archivo
    # (evidencia con datos personales) viajaba en claro. Con esto S3 rechaza
    # cualquier acceso sin TLS, venga de quien venga.
    EvidenciaBucketSoloTls:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref EvidenciaBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: SoloConTLS
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt EvidenciaBucket.Arn
                - !Sub '${EvidenciaBucket.Arn}/*'
              Condition:
                Bool:
                  'aws:SecureTransport': 'false'

    TrabajoBucketSoloTls:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref TrabajoBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: SoloConTLS
              Effect: Deny
              Principal: '*'
              Action: 's3:*'
              Resource:
                - !GetAtt TrabajoBucket.Arn
                - !Sub '${TrabajoBucket.Arn}/*'
              Condition:
                Bool:
                  'aws:SecureTransport': 'false'

    # ==========================================
    # ALARMA DE FALLOS QUE NO SE VEN DESDE AFUERA
    # ==========================================
    # Varias respuestas del sistema son opacas a propósito: la recuperación de
    # contraseña contesta siempre lo mismo, la comprobación de pertenencia
    # contesta 404 y el autorizador niega ante cualquier duda. Eso está bien y no
    # se toca. El costo es que un fallo real se ve igual que el caso previsto —ya
    # tuvimos la recuperación de contraseña caída devolviendo 200— así que el
    # código deja una métrica (ver lib/degradacion.js) y esto la vigila.
    AlertasOperacionTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-alertas-operacion-${self:provider.stage}
        DisplayName: Alertas de operación de Build & Serve

    # Una alarma sin destinatario es una alarma que nadie ve. SNS exige que la
    # dirección confirme por correo: hasta que lo haga, la suscripción queda
    # pendiente y la alarma cambia de estado sin avisarle a nadie.
    AlertasOperacionSuscripcion:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn: !Ref AlertasOperacionTopic
        Protocol: email
        Endpoint: ${self:custom.destinatarioAlertas}

    FallosDependenciaAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-fallos-dependencia-${self:provider.stage}
        AlarmDescription: >-
          Una lectura de la que depende una decisión falló y el sistema respondió
          con su valor neutro (404, respuesta genérica o denegación). Desde afuera
          es indistinguible del caso normal: revisar los logs filtrando por
          FALLO_DEPENDENCIA.
        Namespace: BuildAndServe
        MetricName: FallosDependencia
        Dimensions:
          - Name: stage
            Value: ${self:provider.stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        # Uno solo ya importa: estos fallos no son ruido esperable, son algo que
        # se rompió y que nadie va a reportar porque no se ve.
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        # Sin datos es lo normal (no hubo fallos), no una alarma.
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertasOperacionTopic

    # Separada de FallosDependenciaAlarm a propósito (H-2, lib/limitePin.js): un
    # bloqueo de PIN es esperable —alguien se equivoca un mal día— mientras que
    # un fallo de dependencia nunca lo es. Comparten el mecanismo (EMF, sin
    # filtro por log group) pero no el umbral: acá dispara con un volumen que ya
    # no se explica por errores de tecleo sueltos, agregado a nivel de empresa
    # (la métrica no lleva dimensión por persona).
    PinBloqueadoAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-pin-bloqueado-${self:provider.stage}
        AlarmDescription: >-
          Varias cuentas —o una varias veces— alcanzaron el bloqueo por intentos
          fallidos de PIN en poco tiempo. Revisar los logs filtrando por
          PIN_BLOQUEADO: puede ser alguien recorriendo PIN ajenos con una sesión
          válida, o un dispositivo compartido con un problema real de teclado.
        Namespace: BuildAndServe
        MetricName: PinBloqueado
        Dimensions:
          - Name: stage
            Value: ${self:provider.stage}
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertasOperacionTopic

    # ==========================================
    # SNS
    # ==========================================
    IncidentNotificationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:provider.environment.INCIDENT_NOTIFICATION_TOPIC}
        DisplayName: Notificaciones de Incidentes y Accidentes

    # El estampado del PDF de firmas ya NO usa cola.
    #
    # Existía una cola FIFO con su cola de mensajes fallidos para serializar la
    # regeneración por documento. Resolvía una latencia que no existe: armar el
    # anexo toma 244 ms en un PDF de 750 KB y 1,3 s en uno de 5 MB, así que cabe
    # de sobra en la propia petición. Lo que sí traía era un caché en clave fija
    # que había que invalidar a mano en tres lugares distintos. Ahora la clave del
    # estampado se deriva del archivo y de las firmas (`lib/almacenamiento.js`),
    # y el archivo temporal vive en el bucket de trabajo con expiración de un día.

    # ==========================================
    # MULTI-TENANT CORE TABLES
    # ==========================================

    # Tenants - Empresas clientes del SaaS
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.TENANTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: slug
            AttributeType: S
          - AttributeName: rutEmpresaHmac
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: slug-index
            KeySchema:
              - AttributeName: slug
                KeyType: HASH
            Projection:
              # Ver la nota de obraId-index: solo claves, y la ficha se lee de la
              # tabla. Sus tres usos son comprobaciones de unicidad al dar de alta.
              ProjectionType: KEYS_ONLY
          # `status-index` se eliminó el 19 de septiembre de 2026. Su único
          # llamador era `TenantService.listByEstado`, que a su vez no tenía
          # ninguno: quedó de cuando `GET /tenants` listaba la plataforma entera.
          # Era una copia completa de todas las empresas para una consulta que
          # nadie hacía.
          #
          # rutEmpresaHmac-index (D-10): reemplaza el `Scan` de tabla completa
          # que hacía `getByRutEmpresa` para comprobar unicidad al dar de alta.
          # El RUT de empresa se busca por su HMAC, nunca en claro.
          - IndexName: rutEmpresaHmac-index
            KeySchema:
              - AttributeName: rutEmpresaHmac
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Obras - Proyectos de construccion por tenant
    ObrasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.OBRAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: obraId
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: obraId-index
            KeySchema:
              - AttributeName: obraId
                KeyType: HASH
            Projection:
              # Solo las claves. `ObraService.getById` resuelve la clave acá y lee
              # la obra de la tabla: un atributo nuevo de una obra no aparece
              # duplicado en el índice por el solo hecho de agregarlo.
              #
              # Cambiar la proyección de un índice NO es una actualización: hay
              # que borrarlo y crearlo, y DynamoDB admite una sola operación de
              # índice por tabla y por despliegue. Se hizo en dos pasos, primero
              # el borrado y después el alta.
              ProjectionType: KEYS_ONLY
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Personas - Identidad unificada (reemplaza Users + Workers)
    PersonasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.PERSONAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: rutHmac
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        # Los tres índices estaban con `ProjectionType: ALL`, o sea que cada uno
        # era una COPIA COMPLETA de la ficha: hash del PIN, hash de la contraseña,
        # RUT y campos de salud incluidos. Tres copias más de los datos sensibles,
        # con la misma superficie de exposición que la tabla.
        #
        # Con `KEYS_ONLY` el índice guarda solo lo necesario para llegar a la
        # ficha, y la ficha se lee de la tabla. Cuesta una lectura más por
        # búsqueda; a cambio, el dato sensible vive en un solo lugar. El paso
        # extra está en `PersonaService`, que resuelve índice → clave → ficha.
        #
        # `tenantRut-index` pasó a `tenantRutHmac-index` (D-10): el RUT se busca
        # por su HMAC determinista, nunca en claro — ni siquiera como clave de
        # un índice `KEYS_ONLY`, que de todas formas seguiría siendo una copia
        # buscable del RUT de cada persona.
        GlobalSecondaryIndexes:
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
          - IndexName: tenantRutHmac-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: rutHmac
                KeyType: RANGE
            Projection:
              ProjectionType: KEYS_ONLY
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # ==========================================
    # OPERATIONAL TABLES (updated with tenant GSIs)
    # ==========================================

    # Documents Table - with tenant and obra GSIs
    DocumentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.DOCUMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: documentId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: documentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              # PENDIENTE (D-8): el listado de esta tabla dibuja el elemento
              # entero y no cabe en INCLUDE, que admite 20 atributos como
              # maximo. Se resuelve con KEYS_ONLY mas lectura en lote.
              ProjectionType: ALL
          # NOTE: obraId-index will be added in a follow-up deploy
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Suggestions Table
    SuggestionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SUGGESTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: suggestionId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: suggestionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-createdAt-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              # Lista de PERMITIDOS: lo que se agregue a esta tabla NO entra
              # al indice salvo que alguien lo decida. Ver decision D-8.
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - userId
                - userName
                - source
          # (DynamoDB only allows 1 new GSI per CloudFormation update)
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Activities Table - with tenant GSI
    ActivitiesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.ACTIVITIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: activityId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: activityId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              # PENDIENTE (D-8): el listado de esta tabla dibuja el elemento
              # entero y no cabe en INCLUDE, que admite 20 atributos como
              # maximo. Se resuelve con KEYS_ONLY mas lectura en lote.
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Ausencias / permisos del día. PK = tenantId, SK = "{obraId}#{fecha}#{personaId}"
    # (una ausencia por persona/día/obra; registrar de nuevo la sobrescribe).
    AusenciasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.AUSENCIAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    RolGobernanza:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: gobernanza-retencion
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Leer todas las tablas (el inventario las recorre todas).
                - Effect: Allow
                  Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:Scan]
                  Resource:
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-*-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-*-${self:provider.stage}/index/*'
                # Escribir SOLO en la de gobernanza; en su historial, solo agregar.
                - Effect: Allow
                  Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                  Resource: !GetAtt GobernanzaTable.Arn
                - Effect: Allow
                  Action: [dynamodb:PutItem]
                  Resource: !GetAtt GobernanzaHistorialTable.Arn
                # Tablas y buckets cifrados con la clave propia.
                - Effect: Allow
                  Action: [kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                  Resource: !GetAtt ClaveDatos.Arn
                # Bloqueos de la evidencia: listar, leer y EXTENDER. Sin bypass ni
                # borrado: acortar o suprimir es de la etapa con aprobación.
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:aws:s3:::${self:custom.evidenciaBucketName}'
                - Effect: Allow
                  Action: [s3:GetObjectRetention, s3:PutObjectRetention]
                  Resource: !Sub 'arn:aws:s3:::${self:custom.evidenciaBucketName}/*'

    # ─── Colas de trabajo (D-24, D-25) ───────────────────────────────────────
    # Visibilidad = 6 veces el timeout del trabajador (60 s), como recomienda
    # AWS. Lo que falla 6 veces va a la cola de mensajes fallidos, que tiene
    # alarma; las filas de una carga quedan antes `fallidas` con su motivo
    # (lib/cargas.js, al cuarto intento).
    EventosQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-eventos-${self:provider.stage}
        VisibilityTimeout: 360
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaFallidos.Arn
          maxReceiveCount: 6

    CargasQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-cargas-${self:provider.stage}
        VisibilityTimeout: 360
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ColaFallidos.Arn
          maxReceiveCount: 6

    ColaFallidos:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-cola-fallidos-${self:provider.stage}
        MessageRetentionPeriod: 1209600
        SqsManagedSseEnabled: true

    ColaFallidosAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: ${self:service}-cola-fallidos-${self:provider.stage}
        AlarmDescription: >-
          Un aviso del EventBus o un paso de una carga masiva falló seis veces y
          quedó en la cola de mensajes fallidos. Un aviso ahí es una notificación
          que no llegó: revisar el mensaje, corregir la causa y devolverlo a su
          cola (redrive).
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - Name: QueueName
            Value: !GetAtt ColaFallidos.QueueName
        Statistic: Maximum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - !Ref AlertasOperacionTopic

    # Una carga (ítem CARGA) y sus filas (FILA#000001…). Las filas guardan los
    # datos del Excel hasta crearse; todo vence a los 30 días (D-24).
    CargasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.CARGAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: cargaId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: creadaEn
            AttributeType: S
        KeySchema:
          - AttributeName: cargaId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Disperso: solo el ítem CARGA lleva tenantId y creadaEn, así que el
        # índice nunca contiene filas con datos del Excel.
        GlobalSecondaryIndexes:
          - IndexName: tenantId-creadaEn-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: creadaEn
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: expira
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # ─── Correo: rebotes y quejas (D-21) ─────────────────────────────────────
    CorreosSuprimidosTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.CORREOS_SUPRIMIDOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: correoHmac
            AttributeType: S
        KeySchema:
          - AttributeName: correoHmac
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: expira
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    ConjuntoCorreo:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: ${self:provider.environment.SES_CONFIGURATION_SET}
        ReputationOptions:
          ReputationMetricsEnabled: true
        SendingOptions:
          SendingEnabled: true

    # Sin cifrado propio: SES no puede publicar en un tópico cifrado con la
    # llave administrada de SNS, y el mensaje no se guarda (se entrega y se va).
    CorreoEventosTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:service}-correo-eventos-${self:provider.stage}

    PoliticaCorreoEventosTopic:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics: [!Ref CorreoEventosTopic]
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            # Solo SES de esta cuenta, y solo desde el conjunto de este ambiente.
            - Effect: Allow
              Principal: { Service: ses.amazonaws.com }
              Action: sns:Publish
              Resource: !Ref CorreoEventosTopic
              Condition:
                StringEquals:
                  AWS:SourceAccount: !Ref AWS::AccountId
                ArnLike:
                  AWS:SourceArn: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${self:provider.environment.SES_CONFIGURATION_SET}'

    DestinoEventosCorreo:
      Type: AWS::SES::ConfigurationSetEventDestination
      DependsOn: PoliticaCorreoEventosTopic
      Properties:
        ConfigurationSetName: !Ref ConjuntoCorreo
        EventDestination:
          Name: rebotes-y-quejas
          Enabled: true
          MatchingEventTypes: [bounce, complaint, reject]
          SnsDestination:
            TopicARN: !Ref CorreoEventosTopic

    RolCorreoEventos:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: correo-eventos
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [dynamodb:UpdateItem]
                  Resource: !GetAtt CorreosSuprimidosTable.Arn
                # La llave de HMAC (el correo se guarda por HMAC).
                - Effect: Allow
                  Action: [ssm:GetParameter]
                  Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${self:service}/${self:provider.stage}/campo-hmac-key'
                - Effect: Allow
                  Action: [kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                  Resource: !GetAtt ClaveDatos.Arn

    RolSupresion:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: { Service: lambda.amazonaws.com }
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          - PolicyName: gobernanza-supresion
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # Leer todas las tablas: recalcular el contenido de un lote.
                - Effect: Allow
                  Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:BatchGetItem, dynamodb:Scan]
                  Resource:
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-*-${self:provider.stage}'
                    - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${self:service}-*-${self:provider.stage}/index/*'
                # Borrar y anonimizar SOLO en las tablas del inventario con datos
                # de personas; nunca empresas, obras, sesiones ni la gobernanza.
                - Effect: Allow
                  Action: [dynamodb:DeleteItem, dynamodb:UpdateItem]
                  Resource:
                    - !GetAtt PersonasTable.Arn
                    - !GetAtt DocumentsTable.Arn
                    - !GetAtt SignaturesTable.Arn
                    - !GetAtt SignatureRequestsTable.Arn
                    - !GetAtt ActivitiesTable.Arn
                    - !GetAtt IncidentsTable.Arn
                    - !GetAtt SurveysTable.Arn
                    - !GetAtt AusenciasTable.Arn
                    - !GetAtt EstructuraPreventivaTable.Arn
                    - !GetAtt InboxTable.Arn
                    - !GetAtt SuggestionsTable.Arn
                # Los lotes: crear y cambiar de estado (no borrar).
                - Effect: Allow
                  Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                  Resource: !GetAtt GobernanzaTable.Arn
                # El historial: solo agregar.
                - Effect: Allow
                  Action: [dynamodb:PutItem]
                  Resource: !GetAtt GobernanzaHistorialTable.Arn
                - Effect: Allow
                  Action: [kms:Decrypt, kms:DescribeKey, kms:GenerateDataKey]
                  Resource: !GetAtt ClaveDatos.Arn
                # Borrar versiones de archivos, pasando por encima del bloqueo en
                # modo gobernanza. Es el único rol que puede.
                - Effect: Allow
                  Action: [s3:ListBucketVersions]
                  Resource:
                    - !Sub 'arn:aws:s3:::${self:custom.evidenciaBucketName}'
                    - !Sub 'arn:aws:s3:::${self:custom.trabajoBucketName}'
                - Effect: Allow
                  Action: [s3:DeleteObject, s3:DeleteObjectVersion, s3:BypassGovernanceRetention]
                  Resource:
                    - !Sub 'arn:aws:s3:::${self:custom.evidenciaBucketName}/*'
                    - !Sub 'arn:aws:s3:::${self:custom.trabajoBucketName}/*'

    # Gobernanza del dato personal (Ley 21.719): planes de retención, lotes de
    # supresión pendientes de aprobación, solicitudes de titulares y bloqueos.
    # PK = tenantId, SK con prefijo por tipo (PLAN#, LOTE#, SOLICITUD#…). Nada
    # de esto se borra al suprimir: es la prueba de que la supresión se hizo, y
    # por eso no guarda datos personales, solo identificadores.
    GobernanzaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.GOBERNANZA_TABLE}
        BillingMode: PAY_PER_REQUEST
        # Los planes diarios vencen al año; solicitudes y lotes no llevan ttl.
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Historial de gobernanza: cada solicitud del titular, bloqueo, prórroga,
    # respuesta y supresión, como eventos que SOLO SE AGREGAN. Ningún rol puede
    # actualizar ni borrar ítems de esta tabla (solo PutItem y Query), y se
    # conserva siempre (Retain en todo ambiente): es lo primero que se revisa en
    # una fiscalización. PK = tenantId, SK = HIST#<solicitud>#<instante>#<n>.
    GobernanzaHistorialTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.GOBERNANZA_HISTORIAL_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Auditoría de acceso a datos de salud (D-18): quién vio o descargó datos de
    # salud de otra persona, cuándo y desde dónde; nunca el contenido. Como el
    # historial de gobernanza, solo se le agregan ítems (ningún rol puede
    # actualizar ni borrar) y se conserva siempre. El índice por actor responde
    # "a qué accedió esta cuenta" (informe de brecha, D-19).
    AuditoriaAccesosTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:provider.environment.AUDITORIA_ACCESOS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
          - AttributeName: actorId
            AttributeType: S
          - AttributeName: en
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: actorId-en-index
            KeySchema:
              - AttributeName: actorId
                KeyType: HASH
              - AttributeName: en
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Catálogo de EPP del tenant (DS44 Art. 13). PK = tenantId, SK = eppId:
    # cada empresa administra sus propios elementos y una Query por PK basta
    # para listar el catálogo completo.
    EppTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.EPP_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: eppId
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: eppId
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Estructura preventiva (DS 44 Arts. 23, 50, 65, 66): órganos, integrantes y
    # reuniones en una sola tabla, distinguidos por prefijo en la sort key:
    #   ORG#{organoId}  ·  MIE#{organoId}#{miembroId}  ·  REU#{organoId}#{reunionId}
    # Así listar órganos no arrastra las ~24 reuniones de cada mandato.
    EstructuraPreventivaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.ESTRUCTURA_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: sk
            AttributeType: S
        KeySchema:
          - AttributeName: tenantId
            KeyType: HASH
          - AttributeName: sk
            KeyType: RANGE
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Incidents Table - rename empresaId to tenantId
    IncidentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.INCIDENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: incidentId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: fecha
            AttributeType: S
        KeySchema:
          - AttributeName: incidentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-fecha-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: fecha
                KeyType: RANGE
            Projection:
              # PENDIENTE (D-8): el listado de esta tabla dibuja el elemento
              # entero y no cabe en INCLUDE, que admite 20 atributos como
              # maximo. Se resuelve con KEYS_ONLY mas lectura en lote.
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Signatures Table - with tenant and persona GSIs
    SignaturesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SIGNATURES_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: signatureId
            AttributeType: S
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
        KeySchema:
          - AttributeName: signatureId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              # PENDIENTE (D-8): el listado de esta tabla dibuja el elemento
              # entero y no cabe en INCLUDE, que admite 20 atributos como
              # maximo. Se resuelve con KEYS_ONLY mas lectura en lote.
              ProjectionType: ALL
          - IndexName: requestId-index
            KeySchema:
              - AttributeName: requestId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Signature Requests Table - with tenant GSI
    SignatureRequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SIGNATURE_REQUESTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: requestId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: requestId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              # PENDIENTE (D-8): el listado de esta tabla dibuja el elemento
              # entero y no cabe en INCLUDE, que admite 20 atributos como
              # maximo. Se resuelve con KEYS_ONLY mas lectura en lote.
              ProjectionType: ALL
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Surveys Table - with tenant GSI
    SurveysTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SURVEYS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: surveyId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: surveyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              # Lista de PERMITIDOS: lo que se agregue a esta tabla NO entra al
              # indice salvo que alguien lo decida (D-8). `recipients` quedó
              # adentro por error el 19 de septiembre —el comentario decía
              # "ruts", que no es el nombre real del campo— y llevaba el RUT de
              # cada destinatario de cada encuesta al índice. Corregido el 23.
              # `recipients` va a volver a proyectarse cuando se implemente el
              # diseño de cifrado (D-10): cifrado, en un elemento aparte según
              # corresponda, nunca en claro.
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - titulo
                - descripcion
                - obraId
                - estado
                - createdBy
                - audience
                - tipo
                - cargo
                - kitItemKey
                - stats
                - createdAt
                - updatedAt
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Inbox Messages Table
    InboxTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.INBOX_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: recipientId
            AttributeType: S
          - AttributeName: messageId
            AttributeType: S
          - AttributeName: senderId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: recipientId
            KeyType: HASH
          - AttributeName: messageId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: senderId-createdAt-index
            KeySchema:
              - AttributeName: senderId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              # Lista de PERMITIDOS: lo que se agregue a esta tabla NO entra
              # al indice salvo que alguien lo decida. Ver decision D-8.
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - messageId
                - senderName
                - senderRol
                - type
                - priority
                - subject
                - read
                - readAt
                - archivedByRecipient
                - archivedBySender
                - linkedEntity
                - estado
                - updatedAt
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Vales de firma sin conexión.
    #
    # Reemplaza al PIN guardado en claro en el dispositivo: la persona desbloquea
    # con su PIN, con red, y el dispositivo se queda con vales de un solo uso. Acá
    # solo vive el HASH del vale, igual que con el token de sesión.
    # Licencias de alta: la invitación de un solo uso con la que una empresa hace
    # su propio onboarding. Mismo patrón que la recuperación de contraseña y los
    # vales de firma: el enlace existe en el correo de quien lo recibe, acá vive
    # solo su hash.
    #
    # Sin índices a propósito. El consumo resuelve por clave primaria —que es el
    # hash del token— y el listado del operador recorre la tabla entera, que va a
    # tener decenas de elementos. Un índice acá sería una segunda copia de datos
    # de contacto para ahorrar una operación que nadie hace en caliente.
    LicenciasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.LICENCIAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: licenciaHash
            AttributeType: S
        KeySchema:
          - AttributeName: licenciaHash
            KeyType: HASH
        TimeToLiveSpecification:
          # Bastante después de vencer: una licencia vencida tiene que poder
          # explicarse ("este enlace venció el día tal"), no desaparecer.
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    ValesFirmaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.VALES_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: valeHash
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
        KeySchema:
          - AttributeName: valeHash
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              # Lista de PERMITIDOS: lo que se agregue a esta tabla NO entra
              # al indice salvo que alguien lo decida. Ver decision D-8.
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - usedAt
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Sessions Table - with TTL
    SessionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SESSIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        SSESpecification: ${self:custom.cifradoTablas}
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: tokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Resolución token -> sesión en cada request autenticado. Antes era un
          # `Scan` de la tabla completa. Proyección acotada: el autorizador solo
          # necesita saber quién es y de qué empresa, no la sesión entera.
          - IndexName: tokenHash-index
            KeySchema:
              - AttributeName: tokenHash
                KeyType: HASH
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - sessionId
                - personaId
                - tenantId
                - expiresAt
                - activa
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

