# Service parametrizable: default 'hackatonbackendv2' (backend de DESARROLLO).
# Para la prueba en vivo/producción (EBCO): SLS_SERVICE=hackatonbackendv2-testeo
# (o usar `npm run deploy:testeo`). Ver DEPLOY.md. Nunca editar esta línea a mano.
service: ${env:SLS_SERVICE, 'hackatonbackendv2'}

plugins:
  - serverless-prune-plugin
  - serverless-offline

custom:
  prune:
    automatic: true
    number: 2
  serverless-offline:
    httpPort: 3001
    lambdaPort: 3002
  bucketName: ${self:service}-documents-v245-${self:provider.stage}-${aws:accountId}
  # Protección de datos: 'Retain' SOLO en producción (-testeo) para que un remove/
  # reemplazo de stack no borre tablas ni buckets. En dev = 'Delete' (teardown limpio).
  # Se resuelve por nombre de service. Ver DEPLOY.md.
  deletionPolicies:
    hackatonbackendv2-testeo: Retain
  deletionPolicy: ${self:custom.deletionPolicies.${self:service}, 'Delete'}

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    # --- Multi-Tenant Core Tables ---
    TENANTS_TABLE: ${self:service}-tenants-${self:provider.stage}
    OBRAS_TABLE: ${self:service}-obras-${self:provider.stage}
    PERSONAS_TABLE: ${self:service}-personas-${self:provider.stage}
    # --- Operational Tables ---
    SIGNATURE_REQUESTS_TABLE: ${self:service}-signature-requests-${self:provider.stage}
    SIGNATURES_TABLE: ${self:service}-signatures-${self:provider.stage}
    SESSIONS_TABLE: ${self:service}-sessions-${self:provider.stage}
    SURVEYS_TABLE: ${self:service}-surveys-${self:provider.stage}
    INCIDENTS_TABLE: ${self:service}-incidents-${self:provider.stage}
    DOCUMENTS_TABLE: ${self:service}-documents-${self:provider.stage}
    ACTIVITIES_TABLE: ${self:service}-activities-${self:provider.stage}
    INBOX_TABLE: ${self:service}-inbox-${self:provider.stage}
    SUGGESTIONS_TABLE: ${self:service}-sugerencias-${self:provider.stage}
    # --- Storage ---
    DOCUMENTS_BUCKET: ${self:custom.bucketName}
    INCIDENT_EVIDENCE_BUCKET: ${self:service}-evidence-${self:provider.stage}-${aws:accountId}
    INCIDENT_NOTIFICATION_TOPIC: ${self:service}-incident-notifications-${self:provider.stage}
    DOCUMENT_STAMP_QUEUE_URL: !Ref DocumentStampQueue
    # --- External ---
    SES_SENDER_EMAIL: 'thecodecookers@gmail.com'
    # SMS (AWS SNS). SMS_ENABLED=false apaga el envío sin tocar código (útil en
    # sandbox de SNS, que solo permite enviar a números verificados).
    SMS_ENABLED: ${env:SMS_ENABLED, 'true'}
    SMS_SENDER_ID: ${env:SMS_SENDER_ID, 'BuildServe'}
    # URL del frontend para construir enlaces (ej. recuperación de contraseña).
    # No es secreto (URL pública), así que el default apunta a la demo en CloudFront
    # para que funcione aunque no se cargue el .env. Overridable por env var.
    FRONTEND_URL: ${env:FRONTEND_URL, 'https://d30jksx91fodea.cloudfront.net'}
    IS_OFFLINE: ${env:IS_OFFLINE, 'false'}
    GEMINI_API_KEY: ${env:GEMINI_API_KEY, ''}
    # --- Gating de alta de empresas (Fase 1: PIN estático) ---
    # Código de habilitación requerido para crear una empresa via /tenants/setup.
    # El valor vive en el .env de Backend (TENANT_SIGNUP_CODE). Si queda vacío, no se gatea.
    TENANT_SIGNUP_CODE: ${env:TENANT_SIGNUP_CODE, ''}

  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            # --- Multi-Tenant Core ---
            - !GetAtt TenantsTable.Arn
            - !Sub ${TenantsTable.Arn}/index/*
            - !GetAtt ObrasTable.Arn
            - !Sub ${ObrasTable.Arn}/index/*
            - !GetAtt PersonasTable.Arn
            - !Sub ${PersonasTable.Arn}/index/*
            # --- Operational ---
            - !GetAtt SignatureRequestsTable.Arn
            - !Sub ${SignatureRequestsTable.Arn}/index/*
            - !GetAtt SignaturesTable.Arn
            - !Sub ${SignaturesTable.Arn}/index/*
            - !GetAtt SessionsTable.Arn
            - !GetAtt SurveysTable.Arn
            - !Sub ${SurveysTable.Arn}/index/*
            - !GetAtt IncidentsTable.Arn
            - !Sub ${IncidentsTable.Arn}/index/*
            - !GetAtt InboxTable.Arn
            - !Sub ${InboxTable.Arn}/index/*
            - !GetAtt ActivitiesTable.Arn
            - !Sub ${ActivitiesTable.Arn}/index/*
            - !GetAtt DocumentsTable.Arn
            - !Sub ${DocumentsTable.Arn}/index/*
            - !GetAtt SuggestionsTable.Arn
            - !Sub ${SuggestionsTable.Arn}/index/*

        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: "*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub '${IncidentEvidenceBucket.Arn}/*'
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - !Sub 'arn:aws:s3:::${self:custom.bucketName}/*'
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            - !GetAtt DocumentStampQueue.Arn
        - Effect: Allow
          Action:
            - sns:Publish
          Resource:
            - !Ref IncidentNotificationTopic
        # SMS directo a número (sin topic): SNS exige Resource "*" porque no hay
        # ARN de topic. SetSMSAttributes permite fijar atributos de cuenta si se
        # requiere (ej. tipo de mensaje por defecto / sender ID).
        - Effect: Allow
          Action:
            - sns:Publish
            - sns:SetSMSAttributes
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource:
            - "arn:aws:bedrock:*::foundation-model/anthropic.*"
            - "arn:aws:bedrock:*::foundation-model/amazon.*"
        - Effect: Allow
          Action:
            - aws-marketplace:ViewSubscriptions
            - aws-marketplace:Subscribe
            - aws-marketplace:Unsubscribe
          Resource: "*"

package:
  individually: false
  excludeDevDependencies: true
  patterns:
    - '!node_modules/.prisma/**'
    - '!node_modules/@prisma/**'
    - '!node_modules/.bin/**'
    - '!tests/**'
    - '!**/__tests__/**'

functions:
  # ========================================
  # TENANTS (Empresas / Multi-Tenant)
  # ========================================
  tenantsModule:
    handler: handlers/tenants-module/handler.tenantsHandler
    events:
      - httpApi:
          path: /tenants
          method: any
      - httpApi:
          path: /tenants/{proxy+}
          method: any

  # ========================================
  # OBRAS (Proyectos de Construcción)
  # ========================================
  obrasModule:
    handler: handlers/obras-module/handler.obrasHandler
    events:
      - httpApi:
          path: /obras
          method: any
      - httpApi:
          path: /obras/{proxy+}
          method: any

  # ========================================
  # PERSONAS (Identidad Unificada - reemplaza Users + Workers)
  # ========================================
  personasModule:
    handler: handlers/personas-module/handler.personasHandler
    events:
      - httpApi:
          path: /personas
          method: any
      - httpApi:
          path: /personas/{proxy+}
          method: any

  # Auth (Autenticación)
  authLogin:
    handler: handlers/auth/handler.login
    events:
      - httpApi:
          path: /auth/login
          method: POST

  authChangePassword:
    handler: handlers/auth/handler.changePassword
    events:
      - httpApi:
          path: /auth/change-password
          method: POST

  authForgotPassword:
    handler: handlers/auth/handler.forgotPassword
    events:
      - httpApi:
          path: /auth/forgot-password
          method: POST

  authResetPassword:
    handler: handlers/auth/handler.resetPassword
    events:
      - httpApi:
          path: /auth/reset-password
          method: POST

  authLogout:
    handler: handlers/auth/handler.logout
    events:
      - httpApi:
          path: /auth/logout
          method: POST

  authMe:
    handler: handlers/auth/handler.me
    events:
      - httpApi:
          path: /auth/me
          method: GET

  authValidateToken:
    handler: handlers/auth/handler.validateToken
    events:
      - httpApi:
          path: /auth/validate-token
          method: POST


  # ========================================
  # SIGNATURE REQUESTS (Solicitudes de Firma)
  # ========================================
  createSignatureRequest:
    handler: handlers/signature-requests/handler.create
    events:
      - httpApi:
          path: /signature-requests
          method: POST

  listSignatureRequests:
    handler: handlers/signature-requests/handler.list
    events:
      - httpApi:
          path: /signature-requests
          method: GET

  getSignatureRequest:
    handler: handlers/signature-requests/handler.get
    events:
      - httpApi:
          path: /signature-requests/{id}
          method: GET

  getPendingByWorker:
    handler: handlers/signature-requests/handler.getPendingByWorker
    events:
      - httpApi:
          path: /signature-requests/pending/{workerId}
          method: GET

  getHistoryByWorker:
    handler: handlers/signature-requests/handler.getHistoryByWorker
    events:
      - httpApi:
          path: /signature-requests/history/{workerId}
          method: GET

  cancelSignatureRequest:
    handler: handlers/signature-requests/handler.cancel
    events:
      - httpApi:
          path: /signature-requests/{id}/cancel
          method: POST

  getSignatureRequestStats:
    handler: handlers/signature-requests/handler.getStats
    events:
      - httpApi:
          path: /signature-requests/stats
          method: GET

  processOfflineBatch:
    handler: handlers/signature-requests/handler.processOfflineBatch
    events:
      - httpApi:
          path: /signature-requests/offline-batch
          method: POST

  # Activities (Actividades)
  listActivities:
    handler: handlers/activities/handler.list
    events:
      - httpApi:
          path: /activities
          method: GET

  createActivity:
    handler: handlers/activities/handler.create
    events:
      - httpApi:
          path: /activities
          method: POST

  getActivity:
    handler: handlers/activities/handler.get
    events:
      - httpApi:
          path: /activities/{id}
          method: GET

  registerActivityAttendance:
    handler: handlers/activities/handler.registerAttendance
    events:
      - httpApi:
          path: /activities/{id}/attendance
          method: POST

  getActivityStats:
    handler: handlers/activities/handler.getStats
    events:
      - httpApi:
          path: /activities/stats
          method: GET

  # Documents (Documentos)
  listDocuments:
    handler: handlers/documents/handler.list
    events:
      - httpApi:
          path: /documents
          method: GET

  createDocument:
    handler: handlers/documents/handler.create
    events:
      - httpApi:
          path: /documents
          method: POST

  getDocument:
    handler: handlers/documents/handler.get
    events:
      - httpApi:
          path: /documents/{id}
          method: GET

  updateDocument:
    handler: handlers/documents/handler.update
    events:
      - httpApi:
          path: /documents/{id}
          method: PUT

  assignDocument:
    handler: handlers/documents/handler.assign
    events:
      - httpApi:
          path: /documents/{id}/assign
          method: POST

  signDocument:
    handler: handlers/documents/handler.sign
    events:
      - httpApi:
          path: /documents/{id}/sign
          method: POST

  signBulkDocuments:
    handler: handlers/documents/handler.signBulk
    events:
      - httpApi:
          path: /documents/{id}/sign-bulk
          method: POST

  signAssistedDocument:
    handler: handlers/documents/handler.signAssisted
    events:
      - httpApi:
          path: /documents/{id}/sign-assisted
          method: POST

  downloadSignedDocument:
    handler: handlers/documents/handler.downloadFirmado
    events:
      - httpApi:
          path: /documents/{id}/download-firmado
          method: GET

  stampSignedDocument:
    handler: handlers/documents/handler.stamp
    timeout: 60
    events:
      - sqs:
          arn: !GetAtt DocumentStampQueue.Arn
          batchSize: 1

  # ========================================
  # SIGNATURES (Firmas Digitales)
  # ========================================
  createSignature:
    handler: handlers/signatures/handler.create
    events:
      - httpApi:
          path: /signatures
          method: POST

  createEnrollmentSignature:
    handler: handlers/signatures/handler.createEnrollment
    events:
      - httpApi:
          path: /signatures/enroll
          method: POST

  getSignature:
    handler: handlers/signatures/handler.get
    events:
      - httpApi:
          path: /signatures/{id}
          method: GET

  getSignaturesByWorker:
    handler: handlers/signatures/handler.getByWorker
    events:
      - httpApi:
          path: /signatures/worker/{workerId}
          method: GET

  getSignaturesByRequest:
    handler: handlers/signatures/handler.getByRequest
    events:
      - httpApi:
          path: /signatures/request/{requestId}
          method: GET

  verifySignatureByToken:
    handler: handlers/signatures/handler.verifyByToken
    events:
      - httpApi:
          path: /signatures/verify/{token}
          method: GET

  disputeSignature:
    handler: handlers/signatures/handler.dispute
    events:
      - httpApi:
          path: /signatures/{id}/dispute
          method: POST

  resolveSignatureDispute:
    handler: handlers/signatures/handler.resolve
    events:
      - httpApi:
          path: /signatures/{id}/resolve
          method: PUT

  listSignatureDisputes:
    handler: handlers/signatures/handler.listDisputes
    events:
      - httpApi:
          path: /signatures/disputes
          method: GET

  # ========================================
  # UPLOADS (Subida de archivos a S3)
  # ========================================
  getUploadUrl:
    handler: handlers/uploads/handler.getUploadUrl
    events:
      - httpApi:
          path: /uploads/presigned-url
          method: POST

  getDownloadUrl:
    handler: handlers/uploads/handler.getDownloadUrl
    events:
      - httpApi:
          path: /uploads/download-url
          method: POST

  confirmUpload:
    handler: handlers/uploads/handler.confirmUpload
    events:
      - httpApi:
          path: /uploads/confirm
          method: POST

  deleteUpload:
    handler: handlers/uploads/handler.deleteFile
    events:
      - httpApi:
          path: /uploads/{fileKey}
          method: DELETE

  getBatchDownloadUrls:
    handler: handlers/uploads/handler.getBatchDownloadUrls
    events:
      - httpApi:
          path: /uploads/batch-download-urls
          method: POST

  # AI Assistant (Asistente IA)
  aiChat:
    handler: handlers/ai-assistant/handler.chat
    timeout: 30
    events:
      - httpApi:
          path: /ai/chat
          method: POST

  aiRiskMatrix:
    handler: handlers/ai-assistant/handler.generateRiskMatrix
    timeout: 30
    events:
      - httpApi:
          path: /ai/risk-matrix
          method: POST

  aiPreventionPlan:
    handler: handlers/ai-assistant/handler.generatePreventionPlan
    timeout: 30
    events:
      - httpApi:
          path: /ai/prevention-plan
          method: POST

  aiDailyTalk:
    handler: handlers/ai-assistant/handler.generateDailyTalk
    timeout: 30
    events:
      - httpApi:
          path: /ai/daily-talk
          method: POST

  aiMIPER:
    handler: handlers/ai-assistant/handler.generateMIPER
    timeout: 30
    events:
      - httpApi:
          path: /ai/miper
          method: POST

  aiAnalyzeIncident:
    handler: handlers/ai-assistant/handler.analyzeIncident
    timeout: 30
    events:
      - httpApi:
          path: /ai/analyze-incident
          method: POST

  aiExtractIncident:
    handler: handlers/ai-assistant/handler.extractIncident
    timeout: 30
    events:
      - httpApi:
          path: /ai/extract-incident
          method: POST

  aiTranscribeAudio:
    handler: handlers/ai-assistant/handler.transcribeAudio
    timeout: 60
    events:
      - httpApi:
          path: /ai/transcribe
          method: POST

  # Surveys (Encuestas)
  createSurvey:
    handler: handlers/surveys/handler.create
    events:
      - httpApi:
          path: /surveys
          method: POST

  listSurveys:
    handler: handlers/surveys/handler.list
    events:
      - httpApi:
          path: /surveys
          method: GET

  getSurvey:
    handler: handlers/surveys/handler.get
    events:
      - httpApi:
          path: /surveys/{id}
          method: GET

  updateSurveyResponse:
    handler: handlers/surveys/handler.updateResponseStatus
    events:
      - httpApi:
          path: /surveys/{id}/responses/{workerId}
          method: POST

  incidentsModule:
    handler: handlers/incidents-module/handler.incidentsHandler
    events:
      - httpApi:
          path: /incidents
          method: any
      - httpApi:
          path: /incidents/{proxy+}
          method: any

  # Notifications
  sendWelcomeEmail:
    handler: handlers/notifications/handler.sendWelcome
    events:
      - httpApi:
          path: /test-email
          method: POST

  inboxModule:
    handler: handlers/inbox-module/handler.inboxHandler
    events:
      - httpApi:
          path: /inbox
          method: any
      - httpApi:
          path: /inbox/{proxy+}
          method: any

  # Suggestions (Sugerencias)
  createSuggestion:
    handler: handlers/suggestions/handler.create
    events:
      - httpApi:
          path: /suggestions
          method: POST

resources:
  Resources:
    # ==========================================
    # S3 BUCKETS
    # ==========================================
    DocumentsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        BucketName: ${self:custom.bucketName}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE]
              AllowedOrigins: ['*']
              MaxAge: 3000

    IncidentEvidenceBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        BucketName: ${self:provider.environment.INCIDENT_EVIDENCE_BUCKET}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ['*']
              AllowedMethods: [GET, PUT, POST]
              AllowedHeaders: ['*']
              MaxAge: 3000

    # ==========================================
    # SNS
    # ==========================================
    IncidentNotificationTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:provider.environment.INCIDENT_NOTIFICATION_TOPIC}
        DisplayName: Notificaciones de Incidentes y Accidentes

    # ==========================================
    # SQS - Estampado de PDF firmado (serializado por documento)
    # ==========================================
    # Cola FIFO: el estampado se dispara "bajo demanda" (al pedir la descarga
    # del PDF firmado) pero varios triggers casi simultáneos sobre el MISMO
    # documento (varias descargas pedidas a la vez, o varias firmas llegando
    # justo cuando el documento se completa) deben serializarse para no
    # regenerar el PDF en paralelo y pisarse entre sí. MessageGroupId =
    # documentId garantiza que SQS FIFO procese de a un job por documento.
    DocumentStampDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-stamp-dlq-${self:provider.stage}.fifo
        FifoQueue: true
        MessageRetentionPeriod: 1209600 # 14 días

    DocumentStampQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-document-stamp-${self:provider.stage}.fifo
        FifoQueue: true
        ContentBasedDeduplication: false
        VisibilityTimeout: 120
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt DocumentStampDLQ.Arn
          maxReceiveCount: 3

    # ==========================================
    # MULTI-TENANT CORE TABLES
    # ==========================================

    # Tenants - Empresas clientes del SaaS
    TenantsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.TENANTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: slug
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: slug-index
            KeySchema:
              - AttributeName: slug
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: status-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # Obras - Proyectos de construccion por tenant
    ObrasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.OBRAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: obraId
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: obraId-index
            KeySchema:
              - AttributeName: obraId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    # Personas - Identidad unificada (reemplaza Users + Workers)
    PersonasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.PERSONAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: rut
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          - IndexName: tenantRut-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
              - AttributeName: rut
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # ==========================================
    # OPERATIONAL TABLES (updated with tenant GSIs)
    # ==========================================

    # Documents Table - with tenant and obra GSIs
    DocumentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.DOCUMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: documentId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
        KeySchema:
          - AttributeName: documentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-index
            KeySchema:
              - AttributeName: tenantId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          # NOTE: obraId-index will be added in a follow-up deploy

    # Suggestions Table
    SuggestionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SUGGESTIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: suggestionId
            AttributeType: S
          - AttributeName: tenantId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: suggestionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: tenantId-createdAt-index
            KeySchema:
              - AttributeName: tenantId
