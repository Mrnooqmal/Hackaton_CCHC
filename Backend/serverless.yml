    # Vales de firma sin conexión.
    #
    # Reemplaza al PIN guardado en claro en el dispositivo: la persona desbloquea
    # con su PIN, con red, y el dispositivo se queda con vales de un solo uso. Acá
    # solo vive el HASH del vale, igual que con el token de sesión.
    # Licencias de alta: la invitación de un solo uso con la que una empresa hace
    # su propio onboarding. Mismo patrón que la recuperación de contraseña y los
    # vales de firma: el enlace existe en el correo de quien lo recibe, acá vive
    # solo su hash.
    #
    # Sin índices a propósito. El consumo resuelve por clave primaria —que es el
    # hash del token— y el listado del operador recorre la tabla entera, que va a
    # tener decenas de elementos. Un índice acá sería una segunda copia de datos
    # de contacto para ahorrar una operación que nadie hace en caliente.
    LicenciasTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.LICENCIAS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: licenciaHash
            AttributeType: S
        KeySchema:
          - AttributeName: licenciaHash
            KeyType: HASH
        TimeToLiveSpecification:
          # Bastante después de vencer: una licencia vencida tiene que poder
          # explicarse ("este enlace venció el día tal"), no desaparecer.
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    ValesFirmaTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.VALES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: valeHash
            AttributeType: S
          - AttributeName: personaId
            AttributeType: S
        KeySchema:
          - AttributeName: valeHash
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: personaId-index
            KeySchema:
              - AttributeName: personaId
                KeyType: HASH
            Projection:
              # Lista de PERMITIDOS: lo que se agregue a esta tabla NO entra
              # al indice salvo que alguien lo decida. Ver decision D-8.
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - usedAt
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # Sessions Table - with TTL
    SessionsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.deletionPolicy}
      UpdateReplacePolicy: ${self:custom.deletionPolicy}
      Properties:
        TableName: ${self:provider.environment.SESSIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sessionId
            AttributeType: S
          - AttributeName: tokenHash
            AttributeType: S
        KeySchema:
          - AttributeName: sessionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          # Resolución token -> sesión en cada request autenticado. Antes era un
          # `Scan` de la tabla completa. Proyección acotada: el autorizador solo
          # necesita saber quién es y de qué empresa, no la sesión entera.
          - IndexName: tokenHash-index
            KeySchema:
              - AttributeName: tokenHash
                KeyType: HASH
            Projection:
              ProjectionType: INCLUDE
              NonKeyAttributes:
                - sessionId
                - personaId
                - tenantId
                - expiresAt
                - activa
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true
        # Recuperación a un punto en el tiempo (35 días). Protege contra el
        # error propio —un borrado o una escritura masiva equivocada—, que es
        # bastante más probable que un atacante. Sin esto no hay ninguna vía
        # de recuperación: la tabla se restaura o no existe.
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

