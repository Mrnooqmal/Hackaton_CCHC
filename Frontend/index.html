<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#00264d" />
    <meta name="description" content="Aplicación para trabajadores de construcción" />
    
    <!-- PWA Meta Tags -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" sizes="180x180" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Build & Serve" />
    
    <title>Build &amp; Serve</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Modo claro por defecto (estética institucional CChC); evita el parpadeo
      // oscuro en la carga inicial y en pantallas sin sidebar (p. ej. Login).
      (function () {
        try {
          if (localStorage.getItem('theme') !== 'dark') {
            document.documentElement.classList.add('theme-light');
          }
        } catch (e) {
          document.documentElement.classList.add('theme-light');
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
